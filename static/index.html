<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spend Tracker</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <h1>Spend Tracker</h1>

        <!-- Add Expense -->
        <section class="card">

            <h2>Add Expense</h2>

            <form id="expense-form">

                <label for="amount">
                    Amount
                </label>

                <input
                    type="number"
                    id="amount"
                    name="amount"
                    step="0.01"
                    min="0.01"
                    required
                >


                <label for="category">
                    Category
                </label>

                <input
                    type="text"
                    id="category"
                    name="category"
                    placeholder="Food"
                    required
                >


                <label for="note">
                    Note
                </label>

                <input
                    type="text"
                    id="note"
                    name="note"
                    placeholder="Dinner"
                >


                <label for="date">
                    Date
                </label>

                <input
                    type="date"
                    id="date"
                    name="date"
                    required
                >


                <button type="submit">
                    Add Expense
                </button>

            </form>

            <p id="message"></p>

        </section>


        <!-- Summary -->
        <section class="card">

            <h2>Summary</h2>

            <div class="summary-item">
                <strong>Total Spend:</strong>
                <span id="total-spend">₹0.00</span>
            </div>

            <div class="summary-item">
                <strong>Month-over-Month:</strong>
                <span id="mom-change">N/A</span>
            </div>

            <h3>Spend by Category</h3>

            <ul id="category-list">
                <li>No expenses yet.</li>
            </ul>

            <h3>Insights</h3>

            <ul id="insight-list">
                <li>No insights.</li>
            </ul>

        </section>

    </div>

    <script src="/static/app.js"></script>

</body>
</html>
